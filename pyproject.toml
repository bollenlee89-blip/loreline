[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "loreline"
version = "0.1.0"
description = "git blame tells you who. loreline tells you why. A local-first agent that turns any repo into a living knowledge base."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["git", "blame", "knowledge-base", "llm", "ollama", "mcp", "code-archaeology", "developer-tools", "documentation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Software Development :: Documentation",
]
dependencies = []

[project.scripts]
loreline = "loreline.cli:main"
git-why = "loreline.cli:git_why"

[tool.setuptools]
packages = ["loreline"]

[tool.setuptools.package-data]
loreline = ["web/*.html"]
